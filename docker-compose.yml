version: '3.8'

services:
  # =========================================================================
  # PostgreSQL 16 - Persistent Transaction Audit Log Storage
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: riskshield-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: riskshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riskshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riskshield-network

  # =========================================================================
  # Redis 7 - Sub-millisecond Sliding-Window Velocity & Token Bucket Limiter
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: riskshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - riskshield-network

  # =========================================================================
  # RiskShield Backend - Spring Boot 3 Engine & WebSocket Threat Gateway
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskshield-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskshield
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - riskshield-network

  # =========================================================================
  # RiskShield Frontend - Real-Time SOC Dashboard (React + Tailwind + STOMP)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riskshield-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - riskshield-network

volumes:
  postgres_data:
    name: riskshield_postgres_data
  redis_data:
    name: riskshield_redis_data

networks:
  riskshield-network:
    name: riskshield-network
    driver: bridge
