server:
  port: 8080

spring:
  application:
    name: riskshield-gateway

  datasource:
    # Default local dev uses in-memory H2 with PostgreSQL compatibility mode for instant zero-setup run
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:riskshield_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 1000ms

  h2:
    console:
      enabled: true
      path: /h2-console

riskshield:
  gateway:
    rate-limit:
      requests-per-second: 20
      burst-capacity: 50
  engine:
    short-circuit-enabled: true
    max-allowed-latency-ms: 100
    high-amount-threshold: 10000.00
    velocity-threshold-window-seconds: 60
    velocity-threshold-max-transactions: 4

logging:
  level:
    root: INFO
    com.riskshield: DEBUG
