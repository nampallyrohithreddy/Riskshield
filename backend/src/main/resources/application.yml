server:
  port: ${PORT:8080}

spring:
  application:
    name: riskshield-gateway
  datasource:
    url: jdbc:${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 1000ms

  h2:
    console:
      enabled: true
      path: /h2-console

riskshield:
  gateway:
    rate-limit:
      requests-per-second: 20
      burst-capacity: 50
  engine:
    short-circuit-enabled: true
    max-allowed-latency-ms: 100
    high-amount-threshold: 10000.00
    velocity-threshold-window-seconds: 60
    velocity-threshold-max-transactions: 4

logging:
  level:
    root: INFO
    com.riskshield: DEBUG
